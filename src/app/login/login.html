<main class="auth-page">
  <div class="auth-card u-evidence">
    <p class="auth-card__eyebrow">Acesso ao dossiê</p>
    <h1 class="auth-card__title">Entrar</h1>
    <p class="auth-card__lead">Acesse sua conta para acompanhar compras e continuar de onde parou.</p>

    <form class="auth-card__form" (ngSubmit)="entrar()" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="voce@email.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          [attr.aria-invalid]="erroEmail() ? 'true' : null"
          [attr.aria-describedby]="erroEmail() ? 'email-erro' : null" />
        @if (erroEmail(); as erro) {
          <p class="field__error" id="email-erro" aria-live="polite">{{ erro }}</p>
        }
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [value]="senha()"
          (input)="senha.set($any($event.target).value)"
          [attr.aria-invalid]="erroSenha() ? 'true' : null"
          [attr.aria-describedby]="erroSenha() ? 'senha-erro' : null" />
        @if (erroSenha(); as erro) {
          <p class="field__error" id="senha-erro" aria-live="polite">{{ erro }}</p>
        }
      </div>

      <button class="btn-primary" type="submit" [disabled]="carregando()" [attr.aria-busy]="carregando()">
        {{ carregando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <p class="auth-card__divider">ou</p>

    <button class="btn-secondary" type="button" [disabled]="carregando()" (click)="entrarComGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z" />
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.95v2.33A9 9 0 0 0 9 18Z" />
        <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.05l3.02-2.33Z" />
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.95l3.02 2.33C4.68 5.16 6.66 3.58 9 3.58Z" />
      </svg>
      Entrar com Google
    </button>

    <div class="auth-card__links">
      <a routerLink="/esqueci-senha">Esqueci minha senha</a>
      <a routerLink="/cadastro">Criar conta</a>
    </div>
  </div>
</main>
