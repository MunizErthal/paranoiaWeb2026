<main class="content-page">
  <header class="content-page__header">
    <p class="content-page__eyebrow">Fale com a gente</p>
    <h1>Tem uma pista, ideia ou pergunta?</h1>
    <p class="content-page__lead">
      Envie uma mensagem para a Paranoia. Nós lemos tudo, inclusive as teorias mais improváveis.
    </p>
  </header>

  <form class="content-page__form">
    <label>
      Nome
      <input type="text" name="name" autocomplete="name" />
    </label>
    <label>
      E-mail
      <input type="email" name="email" autocomplete="email" />
    </label>
    <label>
      Mensagem
      <textarea name="message"></textarea>
    </label>
    <button class="content-page__action" type="submit">Enviar mensagem</button>
  </form>
</main>
