<main class="content-page games-page">
  <section class="games-section" aria-labelledby="games-title">
    <div class="games-list" aria-label="Jogos disponíveis">
      <a class="game-card" routerLink="/jogos/cidade-submersa">
        <img
          class="game-card__cover"
          src="/images/jogos/cidadesubmersa/logo.png"
          alt="Capa do jogo A Cidade Submersa" />
        <div class="game-card__details">
          <div class="game-card__tags" aria-label="Categorias">
            <span>Investigativo</span>
            <span>Narrativo</span>
          </div>
          <h2>A Cidade Submersa</h2>
          <p class="game-card__description">
            Uma cidade esquecida pelas marés guarda segredos que não deveriam voltar à superfície.
          </p>
          <dl class="game-card__meta">
            <div>
              <dt>Jogadores</dt>
              <dd>2-6</dd>
            </div>
            <div>
              <dt>Idade</dt>
              <dd>14+</dd>
            </div>
            <div>
              <dt>Duração</dt>
              <dd>60-90 min</dd>
            </div>
          </dl>
          <span class="link-action">Abrir o caso</span>
        </div>
      </a>
    </div>
  </section>
</main>
